name: Reviewer revision script syntax check
on:
  push:
    branches: [reviewer-revision-validation-2026-11]
    paths:
      - "reviewer_revision/**"
      - ".github/workflows/reviewer_script_syntax.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile reviewer scripts without project data
        run: python -m py_compile reviewer_revision/*.py
